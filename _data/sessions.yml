  title: Data Linkage 
  types: [2]
  themes: 
  id: 1008
  speakers: [9] # A/Prof Nadine Andrew
  hidden: false
  description: "A wealth of health data is collected and stored electronically, yet much of this data remains siloed and underutilised. Maximising the use of improved electronic data collections, linkage systems that enable data to be linked at the person level and analytic advancements have great potential to maximise data sharing and increase the potential for ‘big data’ research. Opportunities exist to better deliver higher-impact research at scale through capacity building and knowledge sharing in data linkage.<br><br>This workshop will introduce how large datasets can be reliably linked and used to provide novel insights, using health research as an example. Attendees will also be introduced to M-Link, a community of practice developed to support and oversee data linkage practice at Monash University. Areas of focus include: knowledge sharing; ethics, governance and data security; technical infrastructure and linkage methods and access to external administrative datasets."
  complexity:
  length: 2 hours
  capacity: Limited
  date:  Day 1, Tue 26th Nov 2024
  time:  15.00 - 17.00

