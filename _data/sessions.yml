  title: "Socially Responsible AI/ML"
  types: [1, 2]
  themes: [5]
  id: 1017
  speakers: [20] # Dr. Jathan Sadowski (FIT)
  hidden: false
  description: "This workshop will expand our understanding of AI/ML by placing the design and application of these technologies in a broader societal context. Through group discussion of the participant’s own projects and interests, we will consider the human values, ethical choices, and social motives that are integral parts of technical systems. This will allow us to critically question how and why we build AI/ML, what its purposes and uses should be, and how to ensure it achieves socially beneficial outcomes. Through collective reflection, participants gain greater skills for thinking more deeply (and differently) about their own projects and responsibilities."
  complexity:
  length: 2 hours 
  capacity: Limited
  date: Day 1, Tue 26th Nov 2024
  time: 15.00 - 17.00

-
  title: "Evaluating AI apps for Literature review"
  types: [1, 2]
  themes: [5]
  id: 1018
  speakers: [30, 31, 32] # Sophie Wright, Ines Sincock, Peter Reynolds 
  hidden: false
  description: "Explore cutting-edge AI-powered research tools in this interactive session. We'll dive into how AI can revolutionise your research process, from scoping literature and visualising information landscapes, to summarising key findings. Through hands-on activities and discussions, you'll explore how tools like Elicit, Consensus and Research Rabbit can be integrated into a connected workflow, each adding unique value to your research process. We'll also address important considerations such as transparency and data sources. Whether you're new to AI tools or looking to expand your toolkit, this session will offer valuable insights for researchers at all levels. Join us to share experiences, try out new tools, and explore how AI is transforming the discovery of academic literature.<br><br>Please bring your laptop to this session. All necessary tools will be accessible via a web browser, so no software installation is required. We also encourage you to come prepared with your current research topic, as you'll have the opportunity to work on it during the session."
  complexity:
  length: 1 hour
  capacity: Limited
  date: Day 2, Wed 27th Nov 2024 
  time: 11.00 - 12.00

-
  title: "Machine Learning eResearch Platform (MLeRP)"
  types: [1, 2]
  themes: [5]
  id: 1019
  speakers: [22] # Mitchell Hargrave
  hidden: false
  description: The Machine Learning eResearch Platform (MLeRP) was developed to offer a premium Jupyter notebook experience backed by the power of a GPU cluster, persistent storage, and full control over your software environment. <br><br> MLeRP was designed to take advantage of the Dask and SubmitIt frameworks, allowing users to decouple a Jupyter notebook from a GPU in the cluster rather than only attaching it as a reservation. This means that we can create more user seats and have the capacity to serve more users than otherwise possible. Such flexibility provides users with the ability to offload to differently sized GPU slices or even CPU clusters from within the same notebook for different stages of their pipeline. The MLeRP service also supports batch job submission via a web portal application when they are ready for training and transitioning their code to a more classical GPU HPC environment.<br><br>In this workshop we will discuss how users like you can use MLeRP as a stepping stone, allowing you to take on cluster concepts when you’re ready and preparing you for when they eventually outgrow our platform and scale to HPC.
  complexity:
  length: 1 hour
  capacity: Limited
  date: Day 2, Wed 27th Nov 2024 
  time: 16.00 - 17.00

-
  title: "Time Series Forecasting with Machine Learning Techniques*"
  types: [1, 2a]
  themes: [5]
  id: 1020
  speakers: [23, 35] # Dr. Christoph Bergmeir (FIT), Dr. Abishek Sriramulu
  hidden: false
  description: "In this workshop, we will look into time series forecasting with machine learning techniques. Time series forecasting has traditionally been a field of Econometrics and Statistics, but over the last decade, machine learning methods have become competitive and are now oftentimes the methods of choice for forecasting problems. Generic machine learning models such as neural networks, and CNNs. Transformers usually need to be adapted to work well for forecasting tasks, and also other topics like evaluation and benchmarking are not trivial and require special attention. <br><br> In this workshop, we will aim to discuss where the field of forecasting is right now, and how machine and in particular deep learning can work for forecasting. We will also touch on the newest developments around foundational models for forecasting and will discuss several specialised subtopics of forecasting, with a theory and a practice session."
  complexity:
  length: 4 hours 
  capacity: Limited
  date: Day 3, Thu 28th Nov 2024 
  time: 09.30 - 10.30

