  title: Key Story Talk
  types: [3]
  themes: 
  id: 1011
  speakers: [14] # A/Prof James Trauer 
  hidden: false
  description: "Infectious disease (ID) modelling came to the fore during the pandemic, but there are few or no qualifications to identify competence in the field. ID modellers come from a broad range of backgrounds, with mathematicians, physicists, medical doctors and others often contributing to modelling applications. The interdisciplinary nature of these teams brings the perspectives needed to execute such ID modelling analyses. Despite this, analyses typically rely on the individual modeller to write, execute and describe their model, as well as translate the results for policy.<br><br>The Epidemiological Modelling Unit (EMU) at Monash University has strived to take a different approach, including consistently including a role for a Python developer within its team structure. This has provided many benefits, which include: confidence that the code runs as intended, logistical efficiency in reporting and extending the pipeline beyond the modelling process to include the full pathway from inputs through to building the final report. Moreover, our developers have introduced us to benefits that we had not previously anticipated, such as the improved ergonomics of faster execution."
  complexity:
  length: 30 minutes
  capacity: Limited
  date:  Day 2, Wed 27th Nov 2024 
  time:  09.00 - 09.30

