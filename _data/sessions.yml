  title: 'Key Story Talk'
  types: [3]
  themes: 
  id: 1001
  speakers: [42] # Rob Hyndman
  hidden: false
  description: "I will demonstrate the digital tools that underpin the efficiency and reproducibility of my research workflow. Utilizing GitHub as the platform for version control and collaboration, and R as a foundational tool, I leverage the renv package for managing project-specific R dependencies, and the targets package to avoid unnecessary computation. I employ Quarto for generating multiple versions of my research papers for online repositories and journal submissions, ensuring seamless integration of code and text, without duplication. I'll illustrate the workflow using a recent paper I coauthored on <a href='https://robjhyndman.com/publications/fits.html' target=_blank>Forecasting Interrupted Time Series</a>."
  complexity:
  length: 30 minutes
  capacity: Limited
  date:  Day 1, Tue 26th Nov 2024
  time:  09.30 - 10.00

-
  title: 'Key Story Talk'
  types: [3a]
  themes: 
  id: 1003
  speakers: [4] # Rashina
  hidden: false
  description: "In this key story Prof. Hoda will share her passion for qualitative research, exploring the growing socio-technical nature of many research fields and its implications for researchers at all levels. She will offer insights into conducting rigorous research and achieving robust outcomes, drawn from her years of practice, reviewing, and editing qualitative and mixed methods research. Attendees can delve deeper into these concepts in her newly released Springer book, <i style='font-style: italic;'>Qualitative Research with Socio-Technical Grounded Theory</i>, available on <a href='https://link.springer.com/book/10.1007/978-3-031-60533-8' target=_blank>SpringerLink</a> and <a href='https://www.amazon.com.au/dp/3031605322/ref=cbw_us_au_dp_ags?smid=A4XRJ8S0WXSO0' target=_blank>Amazon</a>. Everyone is warmly invited to join her for the book launch immediately following her talk at ResBaz 2024."
  complexity:
  length: 30 minutes
  capacity: Limited
  date:  Day 1, Tue 26th Nov 2024
  time:  10.00 - 10.30

-
  title: Digital Scholar Lab - GALE
  types: [2]
  themes: 
  id: 1004
  speakers: [5,6] # Darren Brain & Damian Almeida
  hidden: false
  description: "Text mining historical primary sources is an innovative approach that leverages computational techniques to analyse vast collections of documents, manuscripts, and artifacts from the past. This methodology facilitates the extraction of meaningful patterns, trends, and insights that might be overlooked in traditional qualitative analyses.<br><br>By applying natural language processing (NLP) and machine learning algorithms, researchers can uncover hidden relationships within historical texts, enabling a deeper understanding of societal changes, cultural dynamics, and historical narratives. The integration of text mining with digital humanities allows for the exploration of large datasets, transforming how historians and scholars engage with primary sources. <br><br>The Gale Digital Scholar Lab offers a straightforward entry point into Digital Humanities for new researchers and for more experienced scholars, the Gale Digital Scholar Lab provides access to large data sets that can be easily mined and exported for use in custom applications and open-source analytical tools. With the Gale Digital Scholar Lab, Gale has created a research platform to help bridge the gap that often exists between primary sources that are available in the library and the research needs and workflows of faculty and students. As an extension of your primary source collections, Gale Digital Scholar Lab will encourage the use of archival holdings to support broader research needs, content can be analysed in the Lab using the visualization tools available. This research can then be constructed into research articles within the Lab and published to Gale Research Showcase. <br><br>The Gale Research Showcase is an open-access repository of student-written digital scholarship. Projects in the Gale Research Showcase are write-ups of individual or group research conducted in the Gale Digital Scholar Lab. All projects are submitted via a straightforward submission form accessed via Gale Digital Scholar Lab. Submitted work is reviewed to provide feedback on methodology, providing professional visibility and experience with the peer review process. <br><br>This session will explore how the Gale Digital Scholar Lab and Gale Research showcase how students and researchers are engaging with primary sources."
  complexity:
  length: 1 hour
  capacity: Limited
  date:  Day 1, Tue 26th Nov 2024
  time:  11.00 - 12.00

