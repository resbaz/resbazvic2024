  title: "Time Series Forecasting with Machine Learning Techniques*"
  types: [1, 2a]
  themes: [5]
  id: 1020
  speakers: [23, 35] # Dr. Christoph Bergmeir (FIT), Dr. Abishek Sriramulu
  hidden: false
  description: "In this workshop, we will look into time series forecasting with machine learning techniques. Time series forecasting has traditionally been a field of Econometrics and Statistics, but over the last decade, machine learning methods have become competitive and are now oftentimes the methods of choice for forecasting problems. Generic machine learning models such as neural networks, and CNNs. Transformers usually need to be adapted to work well for forecasting tasks, and also other topics like evaluation and benchmarking are not trivial and require special attention. <br><br> In this workshop, we will aim to discuss where the field of forecasting is right now, and how machine and in particular deep learning can work for forecasting. We will also touch on the newest developments around foundational models for forecasting and will discuss several specialised subtopics of forecasting, with a theory and a practice session."
  complexity:
  length: 4 hours 
  capacity: Limited
  date: Day 3, Thu 28th Nov 2024 
  time: 09.30 - 10.30

