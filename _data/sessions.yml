  title: "Introduction to Jax - Lessons learned from the summer2 performance journey"
  types: [1]
  themes: []
  id: 1035
  speakers: [50] #  David Shipman
  hidden: false
  description: <p>Our team focuses on the development of epidemiological time-series models using Python, often in time-critical contexts, so our work requires a combination of fast execution and rapid, expressive model development.  This talk is about the journey our primary modelling toolkit, <a href="https://github.com/monash-emu/summer2">Summer2</a> has taken, particularly with regards to performance, and how we arrived at  <a href="https://jax.readthedocs.io/">Jax</a> - a fast, auto-differentiating compiler from Google, which now forms the basis for much of our new model development.</p><p>There will be a technical introduction to Jax and its surrounding ecosystem, a discussion of our experiences in converting existing modelling code, and finally, how it influences our design choices and modelling work (plus some important lessons learned along the way!) </p><p>While the technical content of this talk relates to numerical computing in Python, it aims to be broadly accessible to anyone with an interest in modelling or the software development process in general.</p>
  complexity:
  length: 30 minutes
  capacity: Limited
  date: Day 2, Wed 27th Nov 2024    
  time: 12.00 - 12.30 

