  title: "Building a Neural Network!*"
  types: [2a]
  themes: []
  id: 1032
  speakers: [41] # Riccardo Bonacci
  hidden: false
  description: "Neural networks (or perceptrons) have become increasingly popular over the last 30 years, and have been shown to be multidisciplinary. The original idea for the neural network stems from a simplistic interpretation of how our brain works, with neurons (or nodes) sending signals to other neurons, which in turn ’activate’ (or ’fire’) to send an output signal. This is truly an over-simplified model of how our brain works, though the mathematical description of this network has shown itself to be extremely flexible in learning structures and patterns from large data sets. This is to an extent that they are known as universal interpolaters.<br><br>In this workshop, we will build step-by-step our own neural networks to test on mock data. We will also compare the performance of the networks we created to ones created by PyTorch, which is a common machine learning library used on Python. This workshop will be performed using Python on a jupyter notebook."
  complexity:
  length: 2 hours 
  capacity: Limited
  date: Day 3, Thu 28th Nov 2024   
  time: 09.30 - 10.30 

