  surname: Hoda
  company: ["Monash University"]
  role: ["Professor of Software Engineering and Associate Dean of Equity, Diversity, and Inclusion"]
  bio: Rashina Hoda is a Professor of Software Engineering and Associate Dean of Equity, Diversity, and Inclusion at the Faculty of Information Technology, Monash University. She is an expert in qualitative empirical research and developed Socio-Technical Grounded Theory (STGT), a modern extension of sociological Grounded Theory. With nearly 20 years of experience, she investigates the human and socio-technical aspects of software engineering and artificial intelligence. Rashina has published over 150 research outputs, been awarded over $5M in research funding, received multiple awards, and serves as an Associate Editor of IEEE Transactions on Software Engineering. A champion for women in STEM, she frequently shares insights at conferences, industry events, and public platforms such as TEDx, SXSW, Agile Australia, ABC Radio National, and more, see <a href='http://rashina.com/videos' target=_blank>rashina.com</a> for more.
