  name: Dianne 
  surname: Cook
  company: ["Monash University"]
  role: ["Professor of Statistics in Econometrics and Business Statistics"]
  bio: Dianne Cook is a Professor of Statistics in Econometrics and Business Statistics at Monash University in Melbourne, Australia. She has a PhD in Statistics from Rutgers University. Her research focuses on statistical graphics, which involves interactive visualisation of high-dimensional data, and statistical inference for data visualisation. In her role at Monash University, she regularly teaches courses on machine learning and data analysis, and she has conducted workshops on data visualisation.
