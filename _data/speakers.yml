  title: Dr.
  name: Deanna
  surname: Deveson Lucas
  company: ["CSL"]
  role: ["Manager, R&D Enabling Technology"]
  bio: "Deanna obtained a Bachelor of Science with Honours, majoring in Molecular Biology and Microbiology from Monash University. She began her career at Pfizer Animal Health in the Research & Development Bioprocess Improvement Group (2004–2007), where she contributed to vaccine research, development, and optimization. She then pursued an industry-based PhD, based at the Department of Microbiology, Monash University and Pfizer Animal Health, where she focused on investigating the bovine immune response to Leptospira spp.  After completing her PhD in 2014, Deanna worked as a postdoctoral researcher in the Bacterial Pathogenesis Laboratory, Dept. Microbiology, Monash University. Her research involved several omics-based projects, including the study of antibiotic resistance mechanisms in Gram-negative pathogens. In 2019, Deanna transitioned to the Monash Bioinformatics Platform as Platform Manager, where she led bioinformatics initiatives across a broad range of research areas and facilitated the delivery of training at a local and national level. From September 2022, she concurrently held the roles of Manager (Bioinformatics) and Acting Director of the Monash Genomics and Bioinformatics Platform, playing a key role in the successful merger of the genomics (MicroMon) and bioinformatics platforms.  In July 2024, Deanna joined CSL’s R&D Enabling Technology team, where she now focuses on supporting the implementation of an operational model for the Laboratory Data Repository, furthering her expertise in data management within a global research context."
  thumbnailUrl: DeannaDeveson-Lucas_CSL.jpeg
