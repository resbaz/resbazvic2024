  surname: Andrew
  company: ["Monash University", "National Centre for Healthy Ageing"]
  role: ["Senior Researcher", "Research Data Lead" ]
  bio: A/Prof Nadine Andrew is a senior researcher at Monash University and Research Data Lead for the National Centre for Healthy Ageing. She is nationally recognised as a leader in generating and translating knowledge in the application of big data to health services research through data linkage, leading a number of large grant-funded projects in this area. She is chair of the Monash Helix data linkage community of practice (M-Link), running workshops through Data Fluency, hosting bi-annual events with external speakers from government and other external organisations, and providing resources and support for Monash researchers wanting to access linked data.
