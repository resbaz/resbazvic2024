  name: Simon    
  surname: Musgrave  
  company:  ["Language Data Commons of Australia"]
  role: ["Training and Communication Lead"]
  bio: Simon Musgrave is the Training and Communication Lead for the Language Data Commons of Australia and an Adjunct Research Fellow in the School of Languages, Literatures, Cultures and Linguistics, Monash University. Starting as a syntactician specialising in Austronesian languages, his research interests extended to cover areas including language endangerment, communication in medical settings and the use of technology for linguistic research. This last interest, through work on the Australian National Corpus project, led to work in the digital humanities and to his current work in research infrastructure for the humanities.
