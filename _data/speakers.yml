  bio: "Dr. Claudia Del Campo is the Operations Manager at the Monash Data Futures Institute, Monash University in Australia. She leads strategic initiatives to bring together AI and Data Science expertise across Monash faculties, and engagement with national and international partners. <br><br>Dr. Del Campo is passionate about interdisciplinary research and cross-sector collaborations. At the Monash Data Futures Institute, she oversees the delivery of the research agenda with a focus on applying AI for Climate Change, Geopolitical Security and Thriving Communities. Dr Del Campo worked in academic research for more than 15 years in Colombia, Israel, USA and Australia in the areas of biomedicine, ecology and water resources management."
