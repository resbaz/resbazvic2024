  bio: Dr Neil Owens is an experienced research development manager with experience in both university and medical research institute settings. He completed a PhD in cardiovascular neuroscience (UniMelb), furthering his research training with postdoctoral positions at The Florey and RMIT where he attracted Heart Foundation grants and an NHMRC Early Career Fellowship.<br><br>A change in career direction led him to the Faculty of Medicine Nursing and Health Sciences at Monash, where he developed numerous large projects. He then moved to Prince Henry’s Institute where he established and managed the grants office. Since then, he has developed funding applications in university, medical research institute, and commercial consulting settings.<br><br>In Dec 2022, he commenced his current role as Senior Manager MRFF initiatives, where he leads Monash’s development efforts aimed at increasing the amount MRFF funds secured.<br>Neil has extensive experience in developing applications for NHMRC, MRFF, ARC and philanthropy, having worked with researchers across STEM and HASS disciplines. He is passionate about positioning research that has meaning and impact for the community. Further details on Neil's experience can be found on LinkedIn.
