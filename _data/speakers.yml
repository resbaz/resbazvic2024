  id: 23	
  title: Dr. 	
  name: Christoph 	
  surname: Bergmeir
  company: ["University of Granada, Spain", "Monash University"]
  role: ["María Zambrano (Senior) Fellow", "Adjunct Senior Research Fellow"]
  bio: "Christoph Bergmeir is a María Zambrano (Senior) Fellow in the Department of Computer Science and Artificial Intelligence at the University of Granada, Spain, and an Adjunct Senior Research Fellow in the Department of Data Science and Artificial Intelligence at Monash University. Before this, he was a Visiting Research Data Scientist at Meta Inc. (formerly Facebook Inc.) in California in the US, and a Senior Lecturer at Monash University. He has a track record of working in forecasting for capacity planning, sustainable energy, and supply chain, and has led teams that have delivered systems for short-term power production forecasting of wind and solar farms, and energy price forecasting. Christoph holds a PhD in Computer Science from the University of Granada, and an M.Sc. degree in Computer Science from the University of Ulm, Germany. He has over 5,800 citations and an h-index of 30. He has received more than AUD 2.7 million in external research funding. Four of his publications on time series forecasting over the last years have been Clarivate Web of Science Highly Cited Papers (top 1% of their research field)."
  thumbnailUrl: ChristophBergmeir_MU.jpg
  rockstar: true
  ribbon:
