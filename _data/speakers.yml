  surname: Trauer
  company: ["Monash University"]
  role: ["Head, Epidemiological Modelling Unit Department of Epidemiology and Preventive Medicine"]
  bio: A/Prof James Trauer is an expert in infectious disease modelling, with a particular focus on COVID-19 and tuberculosis. He leads the Epidemiological Modelling Unit at Monash University, where his team uses mechanistic simulation models to guide public health strategies for infectious disease control.<br><br>His work has been important in shaping the response to the COVID-19 pandemic and informing TB control programs across the Asia-Pacific, including through extensive collaboration with the World Health Organization's Western Pacific and South-East Asia Regions. The team has recently shifted to a capacity building approach for epidemic modelling to enable locally led responses to infectious diseases. As a practising respiratory physician, James brings a clinical perspective to his research, but also remains closely involved in platform development.

