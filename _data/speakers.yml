  surname: Sriramulu  
  company: ["Tymestack"]
  role: ["Founder of Tymestack"]
  bio: "Abishek Sriramulu is the Founder of Tymestack, a forward-thinking startup focused on advancing AI-driven forecasting and optimization solutions. With both a PhD and a Master's in Data Science from Monash University, Dr. Sriramulu has dedicated his career to harnessing artificial intelligence for improved decision-making and enhanced outcomes.<br><br>Specialising in forecasting, Dr. Sriramulu brings extensive experience in developing and deploying production-grade machine learning systems across a variety of industries. His research interests span graph neural networks, multi-modal analytics, and constrained machine learning, with a clear focus on addressing complex, real-world challenges. Passionate about making cutting-edge AI technologies more accessible, Dr. Sriramulu is committed to driving meaningful impact across diverse applications."
