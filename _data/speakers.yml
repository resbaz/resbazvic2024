  bio: Riccardo Bonacci is a PhD candidate at Monash university in the school of Physics and Astronomy. He is a part of the LHCb collaboration, a particle physics experiment situated at the Large Hadron Collider at CERN (Geneva, Switzerland). His research focuses on analysing data taken from the LHCb, and using this to study particles containing the beauty and charm quarks.
