  company: ["Monash EMU (Epidemiological Modelling Unit)"]
  role: ["Lead Software Engineer"]
  bio: David Shipman is the lead software engineer at Monash EMU (Epidemiological Modelling Unit).  He has worked in the (rather niche!) field of modelling platform development for several decades, across multiple domains including finance, hydrology, and epidemiology.  He specialises in Python, numerical computing and expressive domain-specific APIs, with an interest in signal processing and compiler development.  He eventually realised that code is a means to an end - the real work is understanding users and what they want to express - then building tools to empower them.
