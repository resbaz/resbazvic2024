  id: 42
  title: Prof.
  name: Rob J     
  surname: Hyndman  
  company: ["Monash University"]
  role: ["Professor of Statistics"]
  bio: Rob J Hyndman FAA FASSA is a Professor of Statistics in the Department of Econometrics and Business Statistics at Monash University, and an elected Fellow of both the Australian Academy of Science and the <a href='https://socialsciences.org.au/academy-fellow/?sId=0032v00003JxrvjAAB'> Academy of Social Sciences in Australia</a>. He is the author of over 200 research papers and 5 books in statistical science. In 2007, he received the <a href='https://www.science.org.au/past-winners/2007-awardees#moran'>Moran medal</a> from the Australian Academy of Science for his contributions to statistical research, especially in the area of statistical forecasting. In 2021, he received the <a href='https://www.statsoc.org.au/Pitman-Medal-Recipients'> Pitman medal </a> from the Statistical Society of Australia. For over 30 years, Rob has maintained an active consulting practice, assisting hundreds of companies and organizations around the world. He has won awards for his research, teaching, consulting and graduate supervision.
  thumbnailUrl: RobHyndman_MU.jpg
  rockstar: true
