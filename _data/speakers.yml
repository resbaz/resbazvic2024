  title: Prof.
  name: Jacek
  surname: J. Jasieniak 
  company: ["Monash University"]
  role: ["Pro Vice-Chancellor (Research Infrastructure)"]
  bio: Jacek Jasieniak completed a Bachelor of Science (1st Class Honours) from Flinders University (2003, University Medal) and PhD from the University of Melbourne (2008, Chancellor’s Prize) under the supervision of Prof. Paul Mulvaney. He then undertook postdoctoral work as an OCE fellow at the Commonwealth Scientific and Industrial Research Organisation (CSIRO) with Dr Scott Watkins and Dr Ezio Rizzardo (2008-11) and was a Fulbright Fellow with Nobel Laureate, Prof. Alan Heeger, at the University of California Santa Barbara (2011-12). In 2012 he returned to CSIRO, progressing to a Senior Research Scientist and then Group Leader. In 2015 he moved to Monash University as an Associate Professor, where he was also appointed Director of the cross-disciplinary Monash Energy Institute. In 2020 he was promoted to Full Professor and also became the Associate Dean of Research for the Faculty of Engineering. In December 2021, Jacek was promoted to the role of Pro Vice-Chancellor (Research Infrastructure) at Monash University.
  thumbnailUrl: JacekJasieniak.jpeg
  rockstar: true
