  bio: Professor David Powell is the Director of the Monash eResearch, where he leads initiatives to support research through digital expertise and high-end infrastructure across multiple research disciplines. Holding a PhD in Computer Science, he brings deep technical expertise to his role in research infrastructure leadership. In his previous position as Director of the Monash Bioinformatics Platform, he collaborated extensively, applying his analytical expertise to complex biological data. Before returning to Monash University in 2012, Professor Powell gained valuable industry experience leading software development teams and worked in small startup companies, where he contributed to developing innovative technological solutions.
